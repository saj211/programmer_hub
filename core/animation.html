<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cozy Pixel Workspace</title>
<style>
  html,body{
    margin:0; padding:0; height:100%;
    background:#1b1320;
    display:flex; align-items:center; justify-content:center;
    font-family: monospace;
  }
  canvas{
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border-radius:8px;
    box-shadow: 0 0 40px rgba(255,180,120,0.15);
  }
</style>
</head>
<body>
<canvas id="scene" width="320" height="180" style="width:960px;height:540px;"></canvas>
<script>
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// ---------- helpers ----------
function px(x,y,w,h,color){
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), w, h);
}

// ---------- palette ----------
const PAL = {
  bg1:'#2a1f33', bg2:'#231a2b',
  floor:'#3a2a40',
  desk:'#6b4226', deskTop:'#7d4f30',
  laptopBody:'#cfcfcf', laptopScreen:'#7ee8c4', laptopDark:'#2b2b2b',
  skin1:'#e8b48a', skin2:'#a9714f',
  hair1:'#3b2a20', hair2:'#caa472', hair3:'#222222',
  shirt1:'#e76f51', shirt2:'#457b9d', shirt3:'#9b5de5',
  cupBody:'#fdfdfd', coffee:'#6f4518', steam:'rgba(255,255,255,0.55)',
  cat1:'#d9a066', cat2:'#3a3a3a', catWhite:'#f4f4f4',
  star:'#fff7d6', mug2:'#e0e0e0'
};

// ---------- background ----------
function drawBackground(t){
  // sky gradient blocks
  for(let y=0;y<180;y++){
    const f = y/180;
    const r = lerp(42,26,f), g = lerp(31,20,f), b = lerp(51,32,f);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(0,y,320,1);
  }
  // twinkling stars
  for(let i=0;i<18;i++){
    const sx = (i*37)%320;
    const sy = (i*53)%70 + 4;
    const tw = 0.5 + 0.5*Math.sin(t/400 + i);
    ctx.globalAlpha = 0.3 + 0.5*tw;
    px(sx, sy, 1, 1, PAL.star);
    ctx.globalAlpha = 1;
  }
  // floor
  px(0,150,320,30, PAL.floor);
  for(let x=0;x<320;x+=16) px(x,150,1,30,'rgba(0,0,0,0.12)');
  // window
  px(20,20,46,40,'#1a1320');
  px(22,22,42,36,'#3d2f6b');
  px(43,22,2,36,'#1a1320');
  px(22,40,42,2,'#1a1320');
  // little plant by window
  px(70,128,10,18, PAL.desk);
  for(let i=0;i<5;i++){
    px(72+i*1.5, 110+Math.sin(t/300+i)*2, 2,16,'#4f9d69');
  }
}
function lerp(a,b,f){return a+(b-a)*f;}

// ---------- desk + laptop ----------
function drawDesk(x,y){
  px(x-2, y, 64, 6, PAL.deskTop);
  px(x-2, y+6, 64, 26, PAL.desk);
  px(x+2, y+32, 4, 14, '#4a2e16');
  px(x+54, y+32, 4, 14, '#4a2e16');
}

function drawLaptop(x,y,t,idx){
  // base
  px(x, y, 26, 3, PAL.laptopBody);
  // screen, slight bob
  const bob = Math.sin(t/500 + idx)*0.5;
  px(x+2, y-16+bob, 22, 16, PAL.laptopDark);
  px(x+3, y-15+bob, 20, 14, PAL.laptopScreen);
  // flicker lines (code)
  ctx.globalAlpha = 0.5 + 0.3*Math.sin(t/150+idx);
  px(x+5,y-12+bob,10,1,'#0e3b2e');
  px(x+5,y-9+bob,14,1,'#0e3b2e');
  px(x+5,y-6+bob,8,1,'#0e3b2e');
  ctx.globalAlpha = 1;
}

// ---------- person ----------
function drawPerson(x,y,skin,hair,shirt,t,idx, typing){
  // typing bob for hands
  const typeOff = typing ? (Math.sin(t/120+idx*2)>0?0:1) : 0;
  // chair/body
  px(x+2,y-2,12,14, shirt); // torso
  px(x+0,y-2,2,10, shirt);  // left arm
  px(x+14,y-2,2,10, shirt); // right arm
  px(x+1,y+6,3,4, skin); // left hand
  px(x+12,y+6-typeOff,3,4, skin); // right hand (typing bob)
  // head
  px(x+3,y-12,10,10, skin);
  // hair
  px(x+2,y-14,12,4, hair);
  px(x+2,y-10,2,6, hair);
  px(x+12,y-10,2,6, hair);
  // simple face
  px(x+6,y-9,1,1,'#2b2b2b');
  px(x+10,y-9,1,1,'#2b2b2b');
}

// ---------- coffee cup ----------
function drawCup(x,y,t,phase){
  px(x,y,8,7, PAL.cupBody);
  px(x+1,y+1,6,4, PAL.coffee);
  px(x+8,y+2,2,3, PAL.cupBody); // handle
  // steam
  for(let i=0;i<3;i++){
    const sy = y-2-((t/30 + i*20 + phase)%26);
    const sx = x+2+i*1.5 + Math.sin(t/200+i+phase)*2;
    const alpha = 1 - ((t/30+i*20+phase)%26)/26;
    ctx.globalAlpha = Math.max(0,alpha*0.6);
    px(sx, sy, 1,2, PAL.steam);
    ctx.globalAlpha = 1;
  }
}

// ---------- cat ----------
function drawCat(x,y,t,color,idx){
  const tailWag = Math.sin(t/250+idx)*2;
  // body curled
  px(x,y,12,6, color);
  px(x-2,y+2,4,4, color);
  // head
  px(x+9,y-4,6,6, color);
  // ears
  px(x+9,y-6,2,2, color);
  px(x+13,y-6,2,2, color);
  // tail
  px(x-4+tailWag*0.3, y-1+tailWag, 3,3, color);
  // eyes blink
  const blink = Math.sin(t/700+idx)>0.85;
  if(!blink){
    px(x+11,y-2,1,1,'#111');
    px(x+13,y-2,1,1,'#111');
  }
  // breathing
  const breathe = Math.sin(t/400+idx)*0.6;
  px(x+1,y+breathe,8,1, color);
}

// ---------- floating coffee bean particles ----------
function drawAmbient(t){
  for(let i=0;i<6;i++){
    const fx = (i*53 + t/40) % 340 - 10;
    const fy = 30 + (i*23)%100 + Math.sin(t/600+i)*6;
    ctx.globalAlpha = 0.25;
    px(fx,fy,2,2,'#caa472');
    ctx.globalAlpha = 1;
  }
}

// ---------- scene composition ----------
function draw(t){
  drawBackground(t);
  drawAmbient(t);

  // desk 1 - person typing
  drawDesk(20, 110);
  drawLaptop(24,108,t,0);
  drawPerson(8,108,PAL.skin1,PAL.hair1,PAL.shirt1,t,0,true);
  drawCup(56,114,t,0);

  // desk 2 - person sipping, cat on desk
  drawDesk(110, 116);
  drawLaptop(114,114,t,1);
  drawPerson(98,114,PAL.skin2,PAL.hair2,PAL.shirt2,t,1,false);
  drawCup(146,120,t,7);
  drawCat(150,108,t,PAL.cat1,0);

  // desk 3 - person typing, cat curled below
  drawDesk(210, 108);
  drawLaptop(214,106,t,2);
  drawPerson(198,106,PAL.skin1,PAL.hair3,PAL.shirt3,t,2,true);
  drawCup(246,112,t,15);
  drawCat(220,140,t,PAL.cat2,1);

  // sleepy cat far right on floor
  drawCat(280,142,t,PAL.catWhite,2);
}

let start = null;
function loop(ts){
  if(!start) start = ts;
  const t = ts - start;
  draw(t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
